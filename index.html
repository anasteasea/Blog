<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Социальная Сеть с Подписками и Тегами</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- БЛОК АВТОРИЗАЦИИ -->
        <div id="auth-section" class="auth-box">
            <!-- Вход -->
            <div id="login-box" class="form-box">
                <h2>Войти в сеть</h2>
                <form id="login-form">
                    <input type="email" id="login-email" placeholder="Email" required>
                    <input type="password" id="login-password" placeholder="Пароль" required>
                    <button type="submit">Войти</button>
                </form>
                <p>Нет аккаунта? <a href="#" id="to-register">Зарегистрироваться</a></p>
            </div>
            <!-- Регистрация -->
            <div id="register-box" class="form-box hidden">
                <h2>Регистрация</h2>
                <form id="register-form">
                    <input type="text" id="reg-name" placeholder="Имя" required>
                    <input type="email" id="reg-email" placeholder="Email" required>
                    <input type="password" id="reg-password" placeholder="Пароль" required>
                    <div class="avatar-select-label">Выберите цвет аватарки:</div>
                    <div class="avatar-picker">
                        <label><input type="radio" name="reg-avatar" value="#1877f2" checked><span style="background:#1877f2"></span></label>
                        <label><input type="radio" name="reg-avatar" value="#e12f6c"><span style="background:#e12f6c"></span></label>
                        <label><input type="radio" name="reg-avatar" value="#10b981"><span style="background:#10b981"></span></label>
                        <label><input type="radio" name="reg-avatar" value="#f59e0b"><span style="background:#f59e0b"></span></label>
                    </div>
                    <button type="submit">Создать аккаунт</button>
                </form>
                <p>Уже есть аккаунт? <a href="#" id="to-login">Войти</a></p>
            </div>
        </div>

        <!-- БЛОК БЛОГА -->
        <div id="blog-section" class="blog-box hidden">
            <header>
                <div class="user-profile">
                    <div class="avatar" id="current-user-avatar"></div>
                    <div>
                        Привет, <span id="current-user-name">Гость</span>!
                        <br><button id="logout-btn" class="btn-link">Выйти</button>
                    </div>
                </div>
                <h1>👥 СоцСеть</h1>
            </header>

            <div class="main-layout">
                <!-- Левая колонка: Контент -->
                <div class="content-col">
                    <!-- Создание поста -->
                    <section class="editor-panel">
                        <h3 id="editor-title">Создать пост</h3>
                        <form id="post-form">
                            <input type="hidden" id="edit-post-id">
                            <input type="text" id="post-title" placeholder="Заголовок" required>
                            <textarea id="post-content" rows="3" placeholder="Что у вас нового?" required></textarea>
                            
                            <div style="margin: 10px 0;">
                                <label for="post-visibility" style="font-size: 0.9rem; color: #555;">Доступность поста:</label>
                                <select id="post-visibility" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccd0d5; margin-top: 4px;">
                                    <option value="public">🌍 Публичный (виден всем)</option>
                                    <option value="request">🔒 Только по запросу (нужно одобрение)</option>
                                </select>
                            </div>

                            <div style="margin: 10px 0;">
                                <input type="text" id="post-tags" placeholder="Теги (например: спорт, авто, рецепты)" style="margin: 0;">
                            </div>

                            <div class="form-buttons">
                                <button type="submit" id="submit-post-btn">Опубликовать</button>
                                <button type="button" id="cancel-edit-btn" class="btn-secondary hidden">Отмена</button>
                            </div>
                        </form>
                    </section>

                    <!-- Переключатель ленты -->
                    <div class="feed-tabs">
                        <button id="tab-all" class="tab-btn active">Все посты</button>
                        <button id="tab-following" class="tab-btn">Мои подписки</button>
                    </div>

                    <!-- Контейнер для облака тегов -->
                    <div id="tags-cloud" class="tags-cloud-container"></div>

                    <!-- Лента -->
                    <main id="posts-feed"></main>
                </div>

                <!-- Правая колонка: Подписки -->
                <aside class="sidebar-col">
                    <div class="widget">
                        <h3>Кого почитать</h3>
                        <div id="users-suggestions"></div>
                    </div>
                </aside>
            </div>
        </div>

    </div>
    <script src="app.js"></script>
</body>
</html>
